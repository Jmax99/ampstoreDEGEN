<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alien Vibemaxxing Shirt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    .banner {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
    }

    .container {
      padding: 20px;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0;
    }

    .price {
      font-size: 24px;
      color: orange;
      margin: 10px 0;
    }

    input {
      padding: 10px;
      margin: 5px;
      width: 80%;
      max-width: 300px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: orange;
      color: black;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #ff9900;
    }

    .note {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- SHIRT IMAGE -->
  <img src="shirt.png" class="banner" />

  <div class="container">

    <h1>Alien Vibemaxxing Shirt 👽</h1>

    <p class="price">$16.00</p>

    <p>
      One size only: <b>Medium</b> (cosmic fit approved)
    </p>

    <!-- ORDER FORM -->
    <input id="name" placeholder="Full Name" /><br />
    <input id="address" placeholder="Address" /><br />
    <input id="city" placeholder="City" /><br />
    <input id="zip" placeholder="ZIP Code" /><br />
    <input id="country" placeholder="Country Code (US, FR...)" /><br />
    <input id="email" placeholder="Email" /><br />

    <!-- hidden size -->
    <input type="hidden" id="size" value="M" />

    <br />

    <button onclick="orderNow()">ORDER SHIRT NOW 👽</button>

    <p class="note">
      Alien vibemaxxing approved checkout system 🛸
    </p>

  </div>

  <script>
    async function orderNow() {
      const data = {
        name: document.getElementById("name").value,
        address: document.getElementById("address").value,
        city: document.getElementById("city").value,
        zip: document.getElementById("zip").value,
        country: document.getElementById("country").value,
        email: document.getElementById("email").value,
        size: document.getElementById("size").value
      };

      try {
        const res = await fetch("/api/order", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.success) {
          alert("Order sent to Printful 👽");
        } else {
          alert("Error placing order");
          console.log(result);
        }

      } catch (err) {
        alert("Network error");
        console.log(err);
      }
    }
  </script>

</body>
</html>
